# Build platform binaries + Windows full installer; attach to GitHub Releases.
#
# Triggers:
#   - release published (uploads assets to that release)
#   - workflow_dispatch (builds only; uploads workflow artifacts for testing)
#
# Assets (VERSION from tag, without leading "v"):
#   coversheets-<VERSION>-windows-x64.exe              (slim one-file)
#   coversheets-<VERSION>-windows-x64-setup.exe        (full installer: OCR + linearize)
#   coversheets-<VERSION>-macos-arm64

name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            ext: .exe
            full: false
          - os: macos-latest
            platform: macos-arm64
            ext: ""
            full: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            # Manual runs: use package version from source.
            TAG=$(grep -E '^__version__\s*=' coversheets/__init__.py | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          fi
          TAG="${TAG#v}"
          if [ -z "$TAG" ]; then
            echo "Could not determine version" >&2
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
          ASSET="coversheets-${TAG}-${{ matrix.platform }}${{ matrix.ext }}"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"
          echo "Building asset: $ASSET"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ensure Tkinter (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # setup-python wheels may lack _tkinter; brew python-tk provides it.
          if ! python -c "import tkinter" 2>/dev/null; then
            brew install python-tk@3.12 || brew install python-tk
            if ! python -c "import tkinter" 2>/dev/null; then
              for candidate in \
                "$(brew --prefix python-tk@3.12 2>/dev/null)/bin/python3.12" \
                "$(brew --prefix python@3.12 2>/dev/null)/bin/python3.12" \
                /opt/homebrew/bin/python3.12 \
                /usr/local/bin/python3.12; do
                if [ -x "$candidate" ] && "$candidate" -c "import tkinter" 2>/dev/null; then
                  echo "Using $candidate for Tk support"
                  dirname "$candidate" >> "$GITHUB_PATH"
                  break
                fi
              done
            fi
          fi
          python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

      - name: Install package + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -c "import coversheets; print('coversheets', coversheets.__version__)"

      - name: Run tests
        shell: bash
        run: pytest -q

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller coversheets.spec --noconfirm --clean
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f dist/coversheets.exe
            cp dist/coversheets.exe "dist/${ASSET_NAME}"
          else
            test -f dist/coversheets
            cp dist/coversheets "dist/${ASSET_NAME}"
            chmod +x "dist/${ASSET_NAME}"
          fi
          ls -la dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ASSET_NAME }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Full Windows installer: app + pikepdf/ocrmypdf/pypdfium2 + Tesseract.
  # Ghostscript is not required (OCRmyPDF 17+ rasterizes with pypdfium2).
  windows-full:
    name: Build (windows-x64-setup)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(grep -E '^__version__\s*=' coversheets/__init__.py | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          fi
          TAG="${TAG#v}"
          if [ -z "$TAG" ]; then
            echo "Could not determine version" >&2
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
          echo "SETUP_NAME=coversheets-${TAG}-windows-x64-setup.exe" >> "$GITHUB_ENV"
          echo "Building full installer for $TAG"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package extras + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full,dev]"
          python -c "import coversheets, pikepdf, ocrmypdf, pypdfium2; print('coversheets', coversheets.__version__)"
          pytest -q

      # Regenerated on release/full builds only (not required on every PR).
      - name: Generate SBOM and third-party licenses
        shell: bash
        run: |
          python -m pip install -q "cyclonedx-bom>=4.0" "pip-licenses>=5.0"
          python scripts/generate_sbom.py
          test -f licenses/sbom.cdx.json
          test -f licenses/THIRD_PARTY_SHIPPED.md

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: coversheets-${{ env.VERSION }}-sbom
          path: |
            licenses/sbom.cdx.json
            licenses/THIRD_PARTY_SHIPPED.md
            licenses/THIRD_PARTY_NOTICES.md
            licenses/third_party.csv
            licenses/pypdfium2/**
          if-no-files-found: error

      - name: Attach SBOM to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            licenses/sbom.cdx.json
            licenses/THIRD_PARTY_SHIPPED.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Tesseract and Inno Setup
        shell: powershell
        run: |
          # Ghostscript is intentionally omitted — OCR uses pypdfium2 in the frozen app.
          choco install tesseract innosetup -y --no-progress
          # Refresh PATH for subsequent steps in this job via GITHUB_PATH where possible.
          $machine = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
          $user = [System.Environment]::GetEnvironmentVariable("Path", "User")
          echo "$machine;$user" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
            Write-Host "ISCC OK"
          } else {
            Write-Host "ISCC missing after choco install"
            Get-ChildItem "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 FullName
          }

      - name: Build full Windows installer
        shell: powershell
        run: |
          # Deps already installed; still allow script to choco if a tool is missing.
          powershell -ExecutionPolicy Bypass -File scripts/build_windows_full.ps1 -SkipInstallDeps -Version "$env:VERSION"
          if (-not (Test-Path "dist\$env:SETUP_NAME")) {
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Expected dist\$env:SETUP_NAME"
          }
          Get-Item "dist\$env:SETUP_NAME" | Format-List Name, Length, FullName

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SETUP_NAME }}
          path: dist/${{ env.SETUP_NAME }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.SETUP_NAME }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
