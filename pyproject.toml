[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coversheets"
version = "0.11.2"
description = "Add exhibit cover sheets to PDFs via GUI list or batch CLI"
readme = "Readme.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Anson Fung" }]
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0,<5",
    "pypdf>=4.0,<6",
    "customtkinter>=5.2,<6",
    "tkinterdnd2>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]
ocr = [
    # OCRmyPDF 17+ rasterizes with pypdfium2; Ghostscript is no longer required.
    "ocrmypdf>=17.0",
    "pypdfium2>=4.0",
]
optimize = [
    "pikepdf>=8.0",
]
full = [
    "ocrmypdf>=17.0",
    "pypdfium2>=4.0",
    "pikepdf>=8.0",
]

[project.scripts]
coversheets = "coversheets.cli:run"

[project.urls]
Homepage = "https://github.com/uchi-ansonfung/Auto-Cover-Sheets-Script"
Releases = "https://github.com/uchi-ansonfung/Auto-Cover-Sheets-Script/releases"

[tool.setuptools.packages.find]
include = ["coversheets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
